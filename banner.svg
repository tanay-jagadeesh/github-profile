<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>

    <!-- Edge glow gradients -->
    <radialGradient id="glowLeft" cx="0%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#6C63FF;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="100%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glowTop" cx="50%" cy="0%" r="60%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0" />
    </radialGradient>

    <!-- Node glow filter -->
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle text shadow (soft, low blur) -->
    <filter id="textShadow" x="-5%" y="-20%" width="110%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#6C63FF" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)" />

  <!-- Edge glows -->
  <rect width="1200" height="300" fill="url(#glowLeft)" />
  <rect width="1200" height="300" fill="url(#glowRight)" />
  <rect width="1200" height="300" fill="url(#glowTop)" />

  <!-- Neural network connections (lines between nodes) -->
  <g stroke="#6C63FF" stroke-opacity="0.25" stroke-width="1" fill="none">
    <!-- Left cluster connections -->
    <line x1="80" y1="60" x2="160" y2="120"><animate attributeName="stroke-opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite" /></line>
    <line x1="80" y1="60" x2="140" y2="40"><animate attributeName="stroke-opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite" /></line>
    <line x1="160" y1="120" x2="220" y2="80"><animate attributeName="stroke-opacity" values="0.15;0.45;0.15" dur="3.5s" repeatCount="indefinite" /></line>
    <line x1="160" y1="120" x2="200" y2="200"><animate attributeName="stroke-opacity" values="0.1;0.35;0.1" dur="2.8s" repeatCount="indefinite" /></line>
    <line x1="140" y1="40" x2="220" y2="80"><animate attributeName="stroke-opacity" values="0.2;0.5;0.2" dur="3.2s" repeatCount="indefinite" /></line>
    <line x1="60" y1="180" x2="160" y2="120"><animate attributeName="stroke-opacity" values="0.1;0.4;0.1" dur="4.5s" repeatCount="indefinite" /></line>
    <line x1="60" y1="180" x2="200" y2="200"><animate attributeName="stroke-opacity" values="0.15;0.4;0.15" dur="3.8s" repeatCount="indefinite" /></line>
    <line x1="100" y1="240" x2="200" y2="200"><animate attributeName="stroke-opacity" values="0.1;0.35;0.1" dur="3s" repeatCount="indefinite" /></line>
    <line x1="220" y1="80" x2="300" y2="60"><animate attributeName="stroke-opacity" values="0.15;0.4;0.15" dur="4.2s" repeatCount="indefinite" /></line>
    <line x1="200" y1="200" x2="300" y2="240"><animate attributeName="stroke-opacity" values="0.1;0.3;0.1" dur="3.6s" repeatCount="indefinite" /></line>
    <line x1="300" y1="60" x2="380" y2="100"><animate attributeName="stroke-opacity" values="0.15;0.45;0.15" dur="2.9s" repeatCount="indefinite" /></line>
    <line x1="300" y1="240" x2="380" y2="200"><animate attributeName="stroke-opacity" values="0.1;0.4;0.1" dur="3.3s" repeatCount="indefinite" /></line>
    <line x1="380" y1="100" x2="380" y2="200"><animate attributeName="stroke-opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite" /></line>

    <!-- Right cluster connections -->
    <line x1="820" y1="100" x2="900" y2="60"><animate attributeName="stroke-opacity" values="0.15;0.45;0.15" dur="3.1s" repeatCount="indefinite" /></line>
    <line x1="820" y1="100" x2="820" y2="200"><animate attributeName="stroke-opacity" values="0.1;0.4;0.1" dur="3.7s" repeatCount="indefinite" /></line>
    <line x1="820" y1="200" x2="900" y2="240"><animate attributeName="stroke-opacity" values="0.15;0.4;0.15" dur="4.1s" repeatCount="indefinite" /></line>
    <line x1="900" y1="60" x2="980" y2="80"><animate attributeName="stroke-opacity" values="0.1;0.35;0.1" dur="3.4s" repeatCount="indefinite" /></line>
    <line x1="900" y1="240" x2="980" y2="200"><animate attributeName="stroke-opacity" values="0.2;0.5;0.2" dur="2.7s" repeatCount="indefinite" /></line>
    <line x1="980" y1="80" x2="1060" y2="120"><animate attributeName="stroke-opacity" values="0.15;0.45;0.15" dur="3.9s" repeatCount="indefinite" /></line>
    <line x1="980" y1="200" x2="1060" y2="120"><animate attributeName="stroke-opacity" values="0.1;0.4;0.1" dur="3.2s" repeatCount="indefinite" /></line>
    <line x1="1060" y1="120" x2="1120" y2="60"><animate attributeName="stroke-opacity" values="0.15;0.4;0.15" dur="4.3s" repeatCount="indefinite" /></line>
    <line x1="1060" y1="120" x2="1140" y2="180"><animate attributeName="stroke-opacity" values="0.1;0.35;0.1" dur="3.6s" repeatCount="indefinite" /></line>
    <line x1="1120" y1="60" x2="1140" y2="180"><animate attributeName="stroke-opacity" values="0.2;0.5;0.2" dur="2.9s" repeatCount="indefinite" /></line>
    <line x1="1140" y1="180" x2="1170" y2="240"><animate attributeName="stroke-opacity" values="0.15;0.45;0.15" dur="3.5s" repeatCount="indefinite" /></line>
  </g>

  <!-- Neural network nodes — left cluster -->
  <g filter="url(#nodeGlow)">
    <circle cx="80" cy="60" r="4" fill="#6C63FF"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" /><animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite" /></circle>
    <circle cx="140" cy="40" r="3" fill="#8B5CF6"><animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite" /><animate attributeName="r" values="2;4;2" dur="4s" repeatCount="indefinite" /></circle>
    <circle cx="160" cy="120" r="5" fill="#6C63FF"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite" /><animate attributeName="r" values="4;6;4" dur="3.5s" repeatCount="indefinite" /></circle>
    <circle cx="60" cy="180" r="3" fill="#3B82F6"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite" /><animate attributeName="r" values="2;4;2" dur="2.8s" repeatCount="indefinite" /></circle>
    <circle cx="200" cy="200" r="4" fill="#6C63FF"><animate attributeName="opacity" values="0.5;1;0.5" dur="4.5s" repeatCount="indefinite" /><animate attributeName="r" values="3;5;3" dur="4.5s" repeatCount="indefinite" /></circle>
    <circle cx="100" cy="240" r="3" fill="#8B5CF6"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.2s" repeatCount="indefinite" /><animate attributeName="r" values="2;4;2" dur="3.2s" repeatCount="indefinite" /></circle>
    <circle cx="220" cy="80" r="4" fill="#3B82F6"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.8s" repeatCount="indefinite" /><animate attributeName="r" values="3;5;3" dur="3.8s" repeatCount="indefinite" /></circle>
    <circle cx="300" cy="60" r="3" fill="#6C63FF"><animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" /><animate attributeName="r" values="2;4;2" dur="3s" repeatCount="indefinite" /></circle>
    <circle cx="300" cy="240" r="4" fill="#8B5CF6"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.2s" repeatCount="indefinite" /><animate attributeName="r" values="3;5;3" dur="4.2s" repeatCount="indefinite" /></circle>
    <circle cx="380" cy="100" r="5" fill="#6C63FF"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.6s" repeatCount="indefinite" /><animate attributeName="r" values="4;6;4" dur="3.6s" repeatCount="indefinite" /></circle>
    <circle cx="380" cy="200" r="4" fill="#3B82F6"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.9s" repeatCount="indefinite" /><animate attributeName="r" values="3;5;3" dur="2.9s" repeatCount="indefinite" /></circle>
  </g>

  <!-- Neural network nodes — right cluster -->
  <g filter="url(#nodeGlow)">
    <circle cx="820" cy="100" r="5" fill="#6C63FF"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.3s" repeatCount="indefinite" /><animate attributeName="r" values="4;6;4" dur="3.3s" repeatCount="indefinite" /></circle>
    <circle cx="820" cy="200" r="4" fill="#8B5CF6"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite" /><animate attributeName="r" values="3;5;3" dur="4s" repeatCount="indefinite" /></circle>
    <circle cx="900" cy="60" r="3" fill="#3B82F6"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.7s" repeatCount="indefinite" /><animate attributeName="r" values="2;4;2" dur="3.7s" repeatCount="indefinite" /></circle>
    <circle cx="900" cy="240" r="4" fill="#6C63FF"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.1s" repeatCount="indefinite" /><animate attributeName="r" values="3;5;3" dur="3.1s" repeatCount="indefinite" /></circle>
    <circle cx="980" cy="80" r="3" fill="#8B5CF6"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.4s" repeatCount="indefinite" /><animate attributeName="r" values="2;4;2" dur="4.4s" repeatCount="indefinite" /></circle>
    <circle cx="980" cy="200" r="4" fill="#6C63FF"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.7s" repeatCount="indefinite" /><animate attributeName="r" values="3;5;3" dur="2.7s" repeatCount="indefinite" /></circle>
    <circle cx="1060" cy="120" r="5" fill="#3B82F6"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.9s" repeatCount="indefinite" /><animate attributeName="r" values="4;6;4" dur="3.9s" repeatCount="indefinite" /></circle>
    <circle cx="1120" cy="60" r="3" fill="#6C63FF"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite" /><animate attributeName="r" values="2;4;2" dur="3.4s" repeatCount="indefinite" /></circle>
    <circle cx="1140" cy="180" r="4" fill="#8B5CF6"><animate attributeName="opacity" values="0.5;1;0.5" dur="4.1s" repeatCount="indefinite" /><animate attributeName="r" values="3;5;3" dur="4.1s" repeatCount="indefinite" /></circle>
    <circle cx="1170" cy="240" r="3" fill="#3B82F6"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.6s" repeatCount="indefinite" /><animate attributeName="r" values="2;4;2" dur="3.6s" repeatCount="indefinite" /></circle>
  </g>

  <!-- Dark backdrop for text legibility -->
  <rect x="350" y="90" width="500" height="70" rx="6" fill="#0d1117" fill-opacity="0.55"/>

  <!-- Center text -->
  <text
    x="600" y="143"
    font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
    font-size="56"
    font-weight="700"
    fill="#FFFFFF"
    text-anchor="middle"
    filter="url(#textShadow)"
  >Tanay Jagadeesh</text>

  <text
    x="600" y="175"
    font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
    font-size="18"
    font-weight="400"
    fill="#9CA3AF"
    text-anchor="middle"
    letter-spacing="2"
  >Data Scientist · ML Researcher · Builder</text>

  <!-- Subtle divider line under subtitle -->
  <line x1="440" y1="192" x2="760" y2="192" stroke="#6C63FF" stroke-opacity="0.3" stroke-width="1"/>
</svg>
